<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
<style>
  :root { --alpha: .28; --fs: 20px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }

  /* Legibility on ANY background (even fully transparent): glow + thin dark outline around every glyph. */
  #root { position: relative; box-sizing: border-box; height: 100%; padding: 10px 16px 18px; border-radius: 14px;
    background: rgba(8, 10, 14, var(--alpha));
    text-shadow: 0 0 2px #000, 0 0 5px rgba(0,0,0,.95), 0 1px 2px #000;
    -webkit-text-stroke: .45px rgba(0,0,0,.55); paint-order: stroke fill; }

  /* Reading order = eye path: headline first (biggest), then short bullets, all left-aligned in one narrow column. */
  #q { font-size: calc(var(--fs) * .56); color: #9cc2ff; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  #head { font-size: calc(var(--fs) * 1.2); font-weight: 650; line-height: 1.3; letter-spacing: .1px; }
  #pts { list-style: none; margin: 6px 0 0; padding: 0; }
  #pts li { font-size: var(--fs); line-height: 1.4; padding-left: 12px; margin-top: 4px; position: relative; color: #f3f3f3; }
  #pts li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: #5ee3a1; }
  #hint { font-size: calc(var(--fs) * .7); color: #cfd6e4; line-height: 1.4; }

  /* Status is tiny and fades while listening so it never pulls your eyes away from the answer. */
  #foot { position: absolute; left: 16px; right: 16px; bottom: 3px; display: flex; gap: 10px; font-size: 10px; color: #aab; transition: opacity .6s; text-shadow: 0 0 3px #000; -webkit-text-stroke: 0; }
  #foot.quiet { opacity: .0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #777; align-self: center; }
  .live .dot { background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }

  /* Unlocked mode: visible frame, drag bar, resize grip, live transcript. */
  #bar, #grip, #heard { display: none; }
  .edit #root { outline: 1.5px dashed rgba(120,190,255,.9); background: rgba(8,10,14, calc(var(--alpha) + .25)); }
  .edit #bar { display: block; position: absolute; top: 0; left: 0; right: 0; height: 22px; cursor: move; text-align: center; font-size: 11px; line-height: 22px; background: rgba(90,150,255,.35); border-radius: 14px 14px 0 0; -webkit-text-stroke: 0; }
  .edit #grip { display: block; position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, rgba(120,190,255,.95) 50%); border-bottom-right-radius: 14px; }
  .edit #heard { display: block; font-size: 11px; color: #9ab; margin-top: 8px; max-height: 30px; overflow: hidden; }
  .edit #content { margin-top: 18px; }
  .edit #foot { opacity: 1; }

  /* Minimise / close buttons: always reachable (even while the overlay is click-through), faint until you point at them. */
  #btns { position: absolute; top: 3px; right: 6px; display: flex; gap: 4px; z-index: 5; opacity: .3; transition: opacity .15s; -webkit-text-stroke: 0; text-shadow: none; }
  #btns:hover, .edit #btns { opacity: 1; }
  #btns button { all: unset; box-sizing: border-box; width: 22px; height: 20px; border-radius: 6px; text-align: center; line-height: 19px; font-size: 14px; color: #fff; background: rgba(20,24,32,.75); cursor: pointer; }
  #btns button:hover { background: rgba(90,150,255,.9); }
  #btns #bClose:hover { background: #e5484d; }
  #btns #bRestore { display: none; }
  /* Minimised: just a small pill with Restore + Close. */
  .mini #content, .mini #foot, .mini #grip, .mini #bar, .mini #btns #bMin { display: none !important; }
  .mini #btns #bRestore { display: block; }
  .mini #root { padding: 0; outline: none; background: rgba(8,10,14,.55); }
  .mini #btns { opacity: 1; top: 4px; right: 5px; }
  #pill { display: none; }
  .mini #pill { display: block; position: absolute; left: 10px; top: 5px; font-size: 11px; color: #cfd6e4; -webkit-text-stroke: 0; }
  .mini.ping #pill { color: #5ee3a1; animation: ping 1s ease-in-out infinite; }
  @keyframes ping { 50% { opacity: .35; } }
</style>
</head>
<body>
  <div id="root">
    <div id="btns"><button id="bMin" title="Minimise">&#8211;</button><button id="bRestore" title="Restore">&#9633;</button><button id="bClose" title="Hide overlay (Ctrl+Shift+H shows it again)">&#215;</button></div>
    <div id="pill">Copilot</div>
    <div id="bar">⠿ drag to move · drag corner to resize · Ctrl+Shift+M to lock</div>
    <div id="content">
      <div id="q"></div>
      <div id="head"></div>
      <ul id="pts"></ul>
      <div id="hint">Answers to questions appear here. Only you can see this window.</div>
      <div id="heard"></div>
    </div>
    <div id="foot" class="quiet"><span class="dot"></span><span id="status">Idle - waiting for a meeting</span><span id="meeting"></span><span id="lat"></span></div>
    <div id="grip"></div>
  </div>
<script src="overlay.js"></script>
</body>
</html>
